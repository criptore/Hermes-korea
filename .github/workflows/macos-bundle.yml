name: macOS bundle

# Construit HERMES.app + DMG (backend PyInstaller embarqué), puis un test de
# fumée : l'app démarre son backend, et celui-ci s'arrête quand l'app meurt.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/macos-bundle.yml"
      - "scripts/build-macos.sh"
      - "scripts/build-backend.sh"
      - "scripts/smoke-macos.sh"
      - "scripts/lib/**"
      - "backend/hermes_entry.py"
      - "backend/hermes_entry.spec"
      - "backend/requirements.txt"
      - "backend/hermes/surveillance_parent.py"
      - "frontend/src-tauri/**"

concurrency:
  group: macos-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Build HERMES.app + DMG
        env:
          HERMES_PYTHON: python
        run: ./scripts/build-macos.sh
      - name: Smoke test (bundled backend + parent watchdog)
        run: ./scripts/smoke-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HERMES-macos-arm64
          path: installer/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
